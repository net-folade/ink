<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ink.</title>
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ink.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo" id="logo">ink.</div>
    <nav class="nav">
      <span id="nav-note" class="nav-link">Note</span>
      <span id="nav-all" class="nav-link">All notes</span>
      <span id="sync-status" class="sync-status" hidden></span>
    </nav>
  </header>

  <main id="view-note" class="view" hidden>
    <div class="col col-note">
      <textarea id="editor" placeholder="Start writing…" spellcheck="false"></textarea>
      <div class="note-footer">
        <div class="dl-group">
          <span class="dl-label">Download:</span>
          <span id="dl-txt" class="dl-btn">.txt</span>
          <span id="dl-md" class="dl-btn">.md</span>
        </div>
        <span id="new-note" class="new-note-btn">+ New note</span>
      </div>
    </div>
  </main>

  <main id="view-all" class="view view-scroll" hidden>
    <div class="col col-list">
      <div class="page-title">All notes <span id="note-count" class="count"></span></div>
      <div id="notes-list"></div>
      <div id="no-notes" class="empty" hidden>Nothing saved yet — your current note appears here once you start a new one.</div>
    </div>
  </main>
</div>

<div id="login-modal" class="login-modal" hidden>
  <div class="login-card">
    <div class="login-title">sync.</div>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username">
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password">
    <div id="login-error" class="login-error"></div>
    <div class="login-actions">
      <span id="login-cancel" class="login-cancel">Cancel</span>
      <span id="login-submit" class="login-btn">Log in</span>
    </div>
  </div>
</div>

<script src="./app.js"></script>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="./sync.js" defer></script>
</body>
</html>
